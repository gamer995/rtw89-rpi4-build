name: Build patched rtw89-8922au kmod for iStoreOS 24.10.8 RPi4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rtw89-kmod.yml'
      - 'package/kernel/rtw89-8922au-git/**'

permissions:
  contents: write

env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.8/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.8-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  OPENWRT_REF: v24.10.8
  RTW89_REF: 73cd715afee2dda3f670cdae5e40fbeba7d9be36
  KERNEL_VER: 6.6.144
  BACKPORTS_VER: 6.12.96
  KERNEL_ABI: 6.6.144
  OUT_VERSION: 6.6.144.2026.09.04~73cd715-r10
  PKG_NAME: kmod-rtw89-8922au-git

jobs:
  build:
    name: Build patched source inside OpenWrt mac80211 backports
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zstd file wget ca-certificates binutils-aarch64-linux-gnu

      - name: Download OpenWrt 24.10.8 bcm2711 SDK and mac80211 package
        run: |
          set -eu
          mkdir sdk openwrt-src
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt-src
          mkdir -p sdk/package/kernel
          cp -a openwrt-src/package/kernel/mac80211 sdk/package/kernel/

      - name: Prepare mac80211 backports tree
        run: |
          set -eu
          cd sdk
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_kmod-mac80211=m
          CONFIG_PACKAGE_kmod-rtw89=m
          CONFIG_DRIVER_11AC_SUPPORT=y
          CONFIG_DRIVER_11AX_SUPPORT=y
          CONFIG_DRIVER_11BE_SUPPORT=y
          CONFIG_PACKAGE_MAC80211_DEBUGFS=y
          EOF
          make defconfig
          make package/kernel/mac80211/prepare V=s

      - name: Compile OpenWrt mac80211 backports
        run: |
          set -eu
          cd sdk
          make package/kernel/mac80211/compile CONFIG_AUTOREMOVE= V=s -j"$(nproc)"

      - name: Build morrownr rtw89 against compiled backports ABI
        run: |
          set -eu
          git clone https://github.com/morrownr/rtw89.git rtw89-src
          git -C rtw89-src checkout "$RTW89_REF"

          for p in package/kernel/rtw89-8922au-git/patches/*.patch; do
            git -C rtw89-src apply --check "$GITHUB_WORKSPACE/$p"
            git -C rtw89-src apply "$GITHUB_WORKSPACE/$p"
          done

          bp_dir=$(find sdk/build_dir -path "*/mac80211-regular/backports-$BACKPORTS_VER" -type d | head -1)
          test -n "$bp_dir"
          rm -rf "$bp_dir/drivers/net/wireless/realtek/rtw89"
          mkdir -p "$bp_dir/drivers/net/wireless/realtek"
          cp -a rtw89-src "$bp_dir/drivers/net/wireless/realtek/rtw89"

          echo "Backports tree: $bp_dir"
          grep -R "extend RF DACK wait" -n "$bp_dir/drivers/net/wireless/realtek/rtw89" || true
          grep -R "extend RF TSSI wait" -n "$bp_dir/drivers/net/wireless/realtek/rtw89" || true

          cd "$GITHUB_WORKSPACE"
          cd sdk
          bp_dir=$(find build_dir -path "*/mac80211-regular/backports-$BACKPORTS_VER" -type d | head -1)
          linux_dir=$(find build_dir -path "*/linux-bcm27xx_bcm2711/linux-$KERNEL_VER" -type d | head -1)
          symvers=$(find build_dir -path '*/symvers/mac80211.symvers' -type f | head -1)
          toolchain_bin=$(find staging_dir -path '*/bin/aarch64-openwrt-linux-musl-gcc' -type f | head -1)
          test -n "$bp_dir"
          test -n "$linux_dir"
          test -n "$symvers"
          test -n "$toolchain_bin"
          case "$toolchain_bin" in
            /*) ;;
            *) toolchain_bin="$PWD/$toolchain_bin" ;;
          esac
          toolchain_dir=$(dirname "$toolchain_bin")
          export PATH="$toolchain_dir:$PATH"
          "$toolchain_bin" --version | head -1
          test -f "$bp_dir/Makefile.kernel"
          make -C "$bp_dir" \
            KCFLAGS="-ffile-prefix-map=$PWD/build_dir/target-aarch64_cortex-a72_musl=target-aarch64_cortex-a72_musl -fno-caller-saves " \
            CROSS_COMPILE="$toolchain_dir/aarch64-openwrt-linux-musl-" \
            ARCH="arm64" \
            KBUILD_HAVE_NLS=no \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="buildhost" \
            KBUILD_BUILD_VERSION="0" \
            CONFIG_SHELL="bash" \
            V=1 \
            cmd_syscalls= \
            KBUILD_EXTRA_SYMBOLS="$PWD/$symvers" \
            CC="$toolchain_bin" \
            KERNELRELEASE="$KERNEL_VER" \
            EXTRA_CFLAGS="-I$PWD/$bp_dir/include -ffile-prefix-map=$PWD/$bp_dir=backports-$BACKPORTS_VER " \
            KLIB_BUILD="$PWD/$linux_dir" \
            MODPROBE=true \
            KLIB="/lib/modules/$KERNEL_VER" \
            KERNEL_SUBLEVEL=6 \
            KBUILD_LDFLAGS_MODULE_PREREQ= \
            modules
          find "$bp_dir/drivers/net/wireless/realtek/rtw89" -maxdepth 1 -name 'rtw89*_git.ko' -print -exec ls -lh {} \;

      - name: Package and verify iStoreOS modules
        run: |
          set -eu
          rm -rf out verify/data verify/control
          mkdir -p out "verify/data/lib/modules/$KERNEL_VER" verify/control

          bp_dir=$(find sdk/build_dir -path "*/mac80211-regular/backports-$BACKPORTS_VER" -type d | head -1)
          rtw_dir="$bp_dir/drivers/net/wireless/realtek/rtw89"
          find "$rtw_dir" -maxdepth 1 -name '*.ko' -print | sort

          for ko in \
            rtw89_core_git.ko \
            rtw89_usb_git.ko \
            rtw89_8922a_git.ko \
            rtw89_8922au_git.ko
          do
            ko_path="$rtw_dir/$ko"
            test -s "$ko_path"
            cp "$ko_path" "verify/data/lib/modules/$KERNEL_VER/$ko"
            size_hex=$(aarch64-linux-gnu-objdump -h "$ko_path" \
              | awk '$2 == ".gnu.linkonce.this_module" { print $3 }')
            if [ "$size_hex" != "00000280" ]; then
              echo "WARNING: $ko .gnu.linkonce.this_module=0x$size_hex (expected 00000280) - continuing"
            else
              echo "$ko: .gnu.linkonce.this_module=0x$size_hex"
            fi
          done

          for ko in "verify/data/lib/modules/$KERNEL_VER"/*.ko; do
            echo "$(basename "$ko") modinfo:"
            strings "$ko" | grep -E '^(name=|depends=|vermagic=)' | sort || true
          done

          dep_set() {
            strings "$1" \
              | awk -F= '$1 == "depends" { print $2; exit }' \
              | tr ',' '\n' \
              | sort \
              | paste -sd, -
          }

          assert_dep_set() {
            ko="$1"
            expected=$(printf '%s' "$2" | tr ',' '\n' | sort | paste -sd, -)
            actual=$(dep_set "$ko")
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected depends for $(basename "$ko"): got '$actual', expected '$expected'" >&2
              exit 1
            fi
          }

          assert_dep_set "verify/data/lib/modules/$KERNEL_VER/rtw89_core_git.ko" 'mac80211,cfg80211,compat'
          assert_dep_set "verify/data/lib/modules/$KERNEL_VER/rtw89_usb_git.ko" 'rtw89_core_git,mac80211'
          assert_dep_set "verify/data/lib/modules/$KERNEL_VER/rtw89_8922a_git.ko" 'rtw89_core_git,cfg80211'
          assert_dep_set "verify/data/lib/modules/$KERNEL_VER/rtw89_8922au_git.ko" 'rtw89_8922a_git,rtw89_usb_git,compat'

          {
            echo "Package: ${PKG_NAME}"
            echo "Version: ${OUT_VERSION}"
            echo "Depends: kernel (=${KERNEL_ABI}), kmod-cfg80211, kmod-mac80211, kmod-usb-core"
            echo "Source: package/kernel/rtw89-8922au-git"
            echo "SourceName: rtw89-8922au-git"
            echo "License: GPL-2.0 OR BSD-3-Clause"
            echo "Section: kernel"
            echo "Architecture: aarch64_cortex-a72"
            echo "Installed-Size: $(du -k -s verify/data/lib | awk '{print $1}')"
            echo "Description: Realtek RTL8912AU/RTL8922AU USB driver patched for iStoreOS RPi4 USB AP stability"
          } > verify/control/control

          tar -czf control.tar.gz -C verify/control .
          tar -czf data.tar.gz -C verify/data .
          printf '2.0\n' > debian-binary
          out_ipk="out/${PKG_NAME}_${OUT_VERSION}_aarch64_cortex-a72.ipk"
          tar -czf "$out_ipk" ./debian-binary ./control.tar.gz ./data.tar.gz
          echo "OUT_IPK=$out_ipk" >> "$GITHUB_ENV"
          echo "OUT_TAG=v${OUT_VERSION}" >> "$GITHUB_ENV"
          ls -lh "$out_ipk"

      - name: Upload patched .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rtw89-8922au-istoreos-24.10.8-kernel-6.6.144
          path: out/*.ipk
          retention-days: 30

      - name: Publish to public release (no login needed to download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${OUT_TAG}"
          notes="rtw89-8922au for iStoreOS 24.10.8 Raspberry Pi 4
          - kernel: ${KERNEL_VER}
          - mac80211 backports: ${BACKPORTS_VER}
          - source: morrownr/rtw89 ${RTW89_REF}
          - patches: USB AP MAC-flush skip, DACK/TSSI wait extension, OpenWrt backports API compat
          Install: opkg install --force-depends ./kmod-rtw89-8922au-git_*.ipk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${OUT_IPK}" --clobber
          else
            gh release create "$tag" "${OUT_IPK}" --title "$tag" --notes "$notes" --latest
          fi
          echo "Release URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"

      - name: Show build summary
        run: |
          {
            echo '## Patched rtw89-8922au package'
            echo ''
            echo "- Target: iStoreOS 24.10.8 Raspberry Pi 4, kernel ${KERNEL_VER}"
            echo "- Build path: OpenWrt mac80211 backports-${BACKPORTS_VER} package, with morrownr/rtw89 substituted into the backports rtw89 directory"
            echo "- Source: morrownr/rtw89 ${RTW89_REF}"
            echo "- Patches: USB MAC flush skip, RTL8922A DACK wait extension, RTL8922A normal TSSI wait extension, OpenWrt backports API compatibility"
            echo "- Output: ${OUT_IPK}"
          } >> "$GITHUB_STEP_SUMMARY"
