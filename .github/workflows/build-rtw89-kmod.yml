name: Package stable rtw89-8922au kmod for iStoreOS RPi4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rtw89-kmod.yml'
      - 'known-good/*.ipk'
      - 'README.md'

jobs:
  package:
    name: Verify and publish stable r3 package
    runs-on: ubuntu-22.04

    env:
      GOOD_IPK: known-good/kmod-rtw89-8922au-git_6.6.119_d2f175ea-r3_kernel-5642ee_iStoreOS-AP-fix_2026-03-17.ipk
      KERNEL_DEPENDS: 'Depends: kernel (=6.6.119~5642ee3ae5a6da3ce336f51cf968083c-r1), kmod-cfg80211, kmod-mac80211, kmod-usb-core'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu

      - name: Verify known-good iStoreOS package
        run: |
          set -eu

          test -s "$GOOD_IPK"

          rm -rf verify out
          mkdir -p verify/control verify/data out

          tar -xzf "$GOOD_IPK" -C verify
          tar -xzf verify/control.tar.gz -C verify/control
          tar -xzf verify/data.tar.gz -C verify/data

          grep -qx 'Package: kmod-rtw89-8922au-git' verify/control/control
          grep -qx 'Version: 6.6.119.2026.03.05~d2f175ea-r3' verify/control/control
          grep -qx "$KERNEL_DEPENDS" verify/control/control

          for ko in \
            rtw89_core_git.ko \
            rtw89_usb_git.ko \
            rtw89_8922a_git.ko \
            rtw89_8922au_git.ko
          do
            ko_path="verify/data/lib/modules/6.6.119/$ko"
            test -s "$ko_path"
            size_hex=$(aarch64-linux-gnu-objdump -h "$ko_path" \
              | awk '$2 == ".gnu.linkonce.this_module" { print $3 }')
            test "$size_hex" = "00000280"
            echo "$ko: .gnu.linkonce.this_module=0x${size_hex}"
          done

          strings verify/data/lib/modules/6.6.119/rtw89_core_git.ko \
            | grep -qx 'depends=mac80211,cfg80211'
          strings verify/data/lib/modules/6.6.119/rtw89_usb_git.ko \
            | grep -qx 'depends=rtw89_core_git,mac80211'
          strings verify/data/lib/modules/6.6.119/rtw89_8922a_git.ko \
            | grep -qx 'depends=rtw89_core_git,cfg80211'
          strings verify/data/lib/modules/6.6.119/rtw89_8922au_git.ko \
            | grep -qx 'depends=rtw89_8922a_git,rtw89_usb_git'

          cp "$GOOD_IPK" out/

      - name: Upload stable .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rtw89-8922au-stable-r3-istoreos-5642ee
          path: out/*.ipk
          retention-days: 30

      - name: Show build summary
        run: |
          {
            echo '## Stable r3 package'
            echo ''
            echo '- Target: iStoreOS 24.10.5 Raspberry Pi 4, kernel 6.6.119'
            echo '- Kernel ABI: 6.6.119~5642ee3ae5a6da3ce336f51cf968083c-r1'
            echo '- Module struct size: 0x280'
            echo '- Artifact: kmod-rtw89-8922au-stable-r3-istoreos-5642ee'
            echo ''
            echo 'This workflow intentionally publishes the validated r3 package instead of the experimental vanilla-kbuild modules, which loaded but failed RTL8922AU firmware download on iStoreOS.'
          } >> "$GITHUB_STEP_SUMMARY"
